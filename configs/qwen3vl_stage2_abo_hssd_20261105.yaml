# Local implementation only. Provision/check on H100 before separately authorized training.
# Upstream stays pinned; a local DiT subclass adds only condition padding masks.
name: ABO HSSD text-only Qwen3-VL conditioner stage2
training:
  steps: 1000000000
  use_amp: true
  amp_type: bf16
  base_lr: 1.0e-05
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  every_n_train_steps: 3000
  val_check_interval: 3000
  limit_val_batches: 0
  monitor: train/total_loss
  log_every_n_steps: 500
  output_dir: /root/userdata/zc/hunyuan3d-buffalo-1.0-editing-git/results/qwen3vl_stage2_abo_hssd_20261105
  seed: 20261101
  num_nodes: 1
  num_gpus: 1
  update_every: 8
  scale_lr: false
dataset:
  target: scripts.native_21dit.qwen3vl_stage2.data.ABOHSSDTextDataModule
  params:
    paired_index_root: /root/userdata/zc/hunyuan3d-buffalo-1.0-editing-git/assets/native21_abo_hssd_single_image
    metadata_path: /root/userdata/zc/hunyuan3d-buffalo-1.0-editing-git/assets/abo_hssd_v1/metadata/candidates.jsonl
    metadata_revision: 288b06111bc4d06800293ab087989f852a632af2
    caption_seed: 20261027
    batch_size: 1
    num_workers: 0
    val_num_workers: 0
    seed: 20261101
    pc_size: 81920
model:
  target: hy3dshape.models.diffusion.flow_matching_sit.Diffuser
  params:
    first_stage_key: surface
    cond_stage_key: text
    scale_by_std: false
    z_scale_factor: 1.0039506158752403
    torch_compile: false
    first_stage_config:
      target: hy3dshape.models.autoencoders.ShapeVAE
      from_pretrained: /root/userdata/zc/hunyuan3d-buffalo-1.0-editing-git/models/Hunyuan3D-2.1
    cond_stage_config:
      target: scripts.native_21dit.qwen3vl_stage2.conditioner.Qwen3VLTextConditioner
      params:
        model_path: /root/userdata/zc/hunyuan3d-buffalo-1.0-editing-git/models/Qwen3-VL-8B-Instruct
        revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
        task_prefix: "Create a 3D object that faithfully matches the following description:"
        max_length: 2048
        local_files_only: true
        drop_ratio: 0.1
        disable_drop: true
    denoiser_cfg:
      target: scripts.native_21dit.qwen3vl_stage2.denoiser.MaskedHunYuanDiTPlain
      from_pretrained: /root/userdata/zc/hunyuan3d-buffalo-1.0-editing-git/models/Hunyuan3D-2.1
    scheduler_cfg:
      transport:
        target: hy3dshape.models.diffusion.transport.create_transport
        params:
          path_type: Linear
          prediction: velocity
      sampler:
        target: hy3dshape.models.diffusion.transport.Sampler
        params: {}
        ode_params:
          sampling_method: euler
          num_steps: 50
    optimizer_cfg:
      train_image_encoder: true
      image_encoder_lr: 1.0e-05
      optimizer:
        target: torch.optim.AdamW
        params:
          betas: [0.9, 0.99]
          eps: 1.0e-06
          weight_decay: 0.01
      scheduler:
        target: hy3dshape.utils.trainings.lr_scheduler.LambdaWarmUpCosineFactorScheduler
        params:
          warm_up_steps: 50
          f_start: 1.0e-06
          f_min: 0.001
          f_max: 1.0
    pipeline_cfg:
      target: hy3dshape.pipelines.Hunyuan3DDiTFlowMatchingPipeline
    image_processor_cfg: null
callbacks:
  run_state:
    target: scripts.native_21dit.qwen3vl_stage2.callbacks.TextRunStateCallback
    params:
      settings_path: /root/userdata/zc/hunyuan3d-buffalo-1.0-editing-git/configs/qwen3vl_stage2_abo_hssd_20261105.json
  update_scalars:
    target: scripts.native_21dit.qwen3vl_stage2.scalars.TextUpdateScalarCallback
    params:
      every_n_updates: 500
